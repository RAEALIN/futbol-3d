<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fútbol 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08131d;font-family:system-ui,Arial;color:white}#game{display:block;width:100%;height:100%}#hud{position:fixed;inset:16px 16px auto;display:flex;justify-content:space-between;gap:12px;pointer-events:none}.panel{background:#07131dcc;border:1px solid #ffffff28;border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px)}#score{font-size:22px;font-weight:800}#help{font-size:12px;line-height:1.6;color:#d6e6ee}#message{position:fixed;left:50%;top:24%;transform:translateX(-50%);font-size:clamp(24px,5vw,48px);font-weight:900;text-shadow:0 4px 16px #000;text-align:center;pointer-events:none}#start{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);border:0;border-radius:999px;padding:13px 22px;background:#f5d547;color:#17212a;font-weight:900;font-size:15px;cursor:pointer}@media(max-width:650px){#hud{inset:8px}#help{max-width:185px;font-size:10px}#score{font-size:18px}}
</style></head><body><canvas id="game"></canvas>
<div id="hud"><div class="panel"><div id="score">LOCAL 0 — 0 VISITA</div><small>FÚTBOL 3D · PROTOTIPO 0.1</small></div><div class="panel" id="help"><b>CONTROLES</b><br>WASD / Flechas: moverse<br>ESPACIO: patear<br>SHIFT: correr<br>R: reiniciar balón</div></div>
<div id="message">¡A jugar!</div><button id="start">EMPEZAR PARTIDO</button>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#game'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc9ed);scene.fog=new THREE.Fog(0x8bc9ed,55,115);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,180);camera.position.set(0,7,12);
scene.add(new THREE.HemisphereLight(0xe5f6ff,0x42623a,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-18,30,14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-42;sun.shadow.camera.right=42;sun.shadow.camera.top=32;sun.shadow.camera.bottom=-32;scene.add(sun);
const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const grass=mat(0x248b42),white=mat(0xf6f7f4),blue=mat(0x1769d2),skin=mat(0xd99b70),dark=mat(0x17212d);
const field=new THREE.Mesh(new THREE.PlaneGeometry(54,82),grass);field.rotation.x=-Math.PI/2;field.receiveShadow=true;scene.add(field);
function line(x1,z1,x2,z2){const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,len),white);m.position.set((x1+x2)/2,.025,(z1+z2)/2);m.rotation.y=-Math.atan2(dx,dz);scene.add(m)}
line(-27,-41,27,-41);line(-27,41,27,41);line(-27,-41,-27,41);line(27,-41,27,41);line(-27,0,27,0);const circle=new THREE.Mesh(new THREE.RingGeometry(9.05,9.18,64),white);circle.rotation.x=-Math.PI/2;circle.position.y=.035;scene.add(circle);
function box(w,h,d,x,y,z,material,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
for(const z of [-41,41]){const sign=Math.sign(z);line(-20,z-sign*15,20,z-sign*15);line(-20,z-sign*15,-20,z);line(20,z-sign*15,20,z);const g=new THREE.Group();scene.add(g);box(.35,3.2,.35,-7,1.6,z,white,g);box(.35,3.2,.35,7,1.6,z,white,g);box(14,.35,.35,0,3.2,z,white,g);const net=new THREE.Mesh(new THREE.BoxGeometry(13.8,2.9,2.6),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.23}));net.position.set(0,1.5,z+sign*1.2);g.add(net)}
for(const side of [-1,1])for(let row=0;row<4;row++)box(4,.7,78,side*30,row*.8-.1,0,mat(row%2?0x56616e:0x3e4b59));
const player=new THREE.Group();scene.add(player);player.position.set(0,0,17);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.58,.8,5,10),blue);torso.position.y=1.35;torso.castShadow=true;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.36,20,16),skin);head.position.y=2.25;player.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.37,16,12,0,Math.PI*2,0,Math.PI*.55),dark);hair.position.y=2.38;player.add(hair);const legs=[];for(const x of [-.25,.25]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.72,4,8),dark);l.position.set(x,.48,0);player.add(l);legs.push(l)}
const ball=new THREE.Group();scene.add(ball);const sphere=new THREE.Mesh(new THREE.SphereGeometry(.48,24,18),white);sphere.castShadow=true;ball.add(sphere);ball.add(new THREE.Mesh(new THREE.IcosahedronGeometry(.29,0),new THREE.MeshBasicMaterial({color:0x18202a,wireframe:true})));ball.position.set(0,.48,14.5);
const keeper=new THREE.Group();scene.add(keeper);keeper.position.set(0,0,-38.2);const kt=new THREE.Mesh(new THREE.CapsuleGeometry(.52,.75,5,10),mat(0xe8a322));kt.position.y=1.25;keeper.add(kt);const kh=new THREE.Mesh(new THREE.SphereGeometry(.34,18,14),skin);kh.position.y=2.2;keeper.add(kh);for(const x of [-.8,.8]){const g=new THREE.Mesh(new THREE.SphereGeometry(.24),white);g.position.set(x,1.4,0);keeper.add(g)}
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='r')resetBall()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let score=0,started=false,cooldown=0;const scoreEl=document.querySelector('#score'),message=document.querySelector('#message'),velocity=new THREE.Vector3();
function updateScore(){scoreEl.textContent='LOCAL '+score+' — 0 VISITA'}function resetBall(){ball.position.set(player.position.x,.48,player.position.z-2.3);velocity.set(0,0,0)}
document.querySelector('#start').onclick=()=>{started=true;message.textContent='¡JUEGA!';document.querySelector('#start').style.display='none';setTimeout(()=>message.textContent='',1200)};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.035);
if(started){cooldown=Math.max(0,cooldown-dt);const forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);const input=new THREE.Vector3(side,0,-forward);
if(input.lengthSq()>0){input.normalize();player.position.addScaledVector(input,(keys.shift?13:8)*dt);player.rotation.y=Math.atan2(input.x,-input.z);legs[0].rotation.x=Math.sin(performance.now()*.015)*.5;legs[1].rotation.x=-legs[0].rotation.x}
player.position.x=THREE.MathUtils.clamp(player.position.x,-25,25);player.position.z=THREE.MathUtils.clamp(player.position.z,-39,38);
const near=ball.position.distanceTo(new THREE.Vector3(player.position.x,.48,player.position.z-1.1));if(near<2.2&&velocity.length()<2.5)ball.position.lerp(new THREE.Vector3(player.position.x,.48,player.position.z-1.2),Math.min(1,dt*5));
if(keys[' ']&&cooldown===0&&near<2.6){velocity.set(Math.sin(player.rotation.y)*23,.13,-Math.cos(player.rotation.y)*23);cooldown=.55}
ball.position.addScaledVector(velocity,dt);velocity.multiplyScalar(Math.pow(.985,dt*60));velocity.y-=9.8*dt;if(ball.position.y<.48){ball.position.y=.48;if(velocity.y<0)velocity.y*=-.42}
if(Math.abs(ball.position.x)>26){ball.position.x=Math.sign(ball.position.x)*26;velocity.x*=-.55}
if(ball.position.z>40||ball.position.z< -41.5){if(ball.position.z< -40.5&&Math.abs(ball.position.x)<6.7&&ball.position.y<3.1){score++;updateScore();message.textContent='¡GOOOOOOL! ⚽';resetBall();setTimeout(()=>message.textContent='',1500)}else{ball.position.z=THREE.MathUtils.clamp(ball.position.z,-40,40);velocity.z*=-.55}}
keeper.position.x=THREE.MathUtils.clamp(ball.position.x*.45,-5.5,5.5);const desired=new THREE.Vector3(player.position.x-Math.sin(player.rotation.y)*8,5.2,player.position.z+Math.cos(player.rotation.y)*8);camera.position.lerp(desired,1-Math.exp(-dt*5));camera.lookAt(player.position.x,1.25,player.position.z-0.5)}
ball.rotation.x+=velocity.z*dt;ball.rotation.z-=velocity.x*dt;renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script></body></html>
